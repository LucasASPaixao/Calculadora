services:
  postgres:
    image: postgres:16-alpine
    container_name: calculadora_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: calculadora_db
      POSTGRES_USER: calculadora_user
      POSTGRES_PASSWORD: calculadora_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calculadora_user -d calculadora_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
